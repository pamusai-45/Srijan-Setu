<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Forbidden (403) - Srijan Setu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body style="background-color: var(--bg-cream); min-height: 100vh; display: flex; align-items: center; justify-content: center;">

<div class="text-center p-5" style="max-width: 540px;">
    <div class="user-avatar-circle mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2rem; background: #fee2e2; border-color: #ef4444; color: #dc2626;">
        <i class="bi bi-shield-lock-fill"></i>
    </div>
    <span class="jig-badge badge-severity-critical mb-3">HTTP 403 • ACCESS FORBIDDEN</span>
    <h1 class="fw-bold mb-2 text-dark" style="font-size: 2rem;">Unauthorized Access</h1>
    <p class="text-muted mb-4">You do not possess the appropriate role permissions or credentials to access this protected sector of Srijan Setu.</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('index') }}" class="btn-jig-primary">
            <i class="bi bi-arrow-left"></i> Return to Your Dashboard
        </a>
        <a href="{{ url_for('auth.logout') }}" class="btn-jig-outline">
            <i class="bi bi-box-arrow-right"></i> Switch Account
        </a>
    </div>
</div>

</body>
</html>
